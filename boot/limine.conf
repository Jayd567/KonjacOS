# Limine bootloader configuration. See ../limine/CONFIG.md upstream (or
# https://github.com/limine-bootloader/limine/blob/v9.x/CONFIG.md) for the
# full syntax; this is deliberately minimal.

timeout: 3

/KonjacOS
    protocol: limine
    # Non-relocatable, fixed-address kernel (see kernel/linker.ld) -- KASLR
    # has nothing to randomise here, so keep it off for predictable
    # addresses while debugging.
    kaslr: no
    path: boot():/boot/kernel.elf
