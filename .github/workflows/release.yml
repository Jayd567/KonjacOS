name: Release

# Push a tag like v0.2.0, or run this workflow from the Actions tab with a
# version, to build the bootable images and publish a GitHub Release. The
# release notes come from that version's section in CHANGELOG.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.2.0 (creates the tag)"
        required: true

env:
  VERSION: ${{ inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso mtools dosfstools zip

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release images
        run: make MODE=release VERSION=$VERSION release

      - name: Extract release notes
        run: |
          version="${VERSION#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if ($0 ~ "^## \\[?v?" v "\\]?([ ]|$)") { found=1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: KonjacOS ${{ env.VERSION }}
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: dist/*
